<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@kujam/* Developer Playground</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --border: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --code: #93c5fd;
        --ok: #22c55e;
        --warn: #f59e0b;
        --error: #ef4444;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }
      button,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      select {
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #273449;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.ghost {
        background: transparent;
      }
      code {
        color: var(--code);
      }
      .muted {
        color: var(--muted);
        line-height: 1.5;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .row.wrap {
        flex-wrap: wrap;
      }

      /* ---------- Kerangka ---------- */
      .playground-shell {
        display: grid;
        grid-template-rows: 48px minmax(0, 1fr);
        grid-template-columns: 260px minmax(0, 1fr) 340px;
        grid-template-areas:
          'topbar topbar topbar'
          'left stage right';
        width: 100%;
        height: 100%;
      }
      .playground-shell[data-debug='false'] {
        grid-template-columns: 260px minmax(0, 1fr) 0;
      }
      .playground-shell[data-debug='false'] .panel-right {
        display: none;
      }
      .playground-shell[data-bare='true'] {
        grid-template-rows: minmax(0, 1fr);
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: 'stage';
      }
      .playground-shell[data-bare='true'] .topbar,
      .playground-shell[data-bare='true'] .panel-left,
      .playground-shell[data-bare='true'] .panel-right {
        display: none;
      }
      .topbar {
        grid-area: topbar;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        min-width: 0;
      }
      .topbar .muted {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .panel-left,
      .panel-right {
        background: var(--panel);
        padding: 16px;
        overflow-y: auto;
        font-size: 13px;
      }
      .panel-left {
        grid-area: left;
        border-right: 1px solid var(--border);
      }
      .panel-right {
        grid-area: right;
        border-left: 1px solid var(--border);
        font-size: 12px;
      }
      .panel-section + .panel-section {
        margin-top: 20px;
      }
      .panel-section h3 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .panel-section > * + * {
        margin-top: 8px;
      }
      .stage {
        grid-area: stage;
        position: relative;
        overflow: auto;
      }
      .stage[data-layout='board'] {
        overflow: hidden;
        background: radial-gradient(var(--border) 1px, transparent 1px);
        background-size: 20px 20px;
        background-color: var(--bg);
      }
      pre {
        padding: 10px;
        border-radius: 6px;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--code);
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
      }

      /* ---------- Popover QR ---------- */
      .popover-anchor {
        position: relative;
      }
      .popover {
        position: absolute;
        top: 40px;
        right: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 260px;
        padding: 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.4);
      }
      .qr-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        word-break: break-all;
        font-size: 12px;
      }
      .qr-item img {
        background: #fff;
        border-radius: 6px;
        image-rendering: pixelated;
      }
      .qr-item a {
        color: var(--code);
      }

      /* ---------- Lab ---------- */
      .lab {
        max-width: 760px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .lab h2 {
        font-size: 15px;
      }
      .code-input {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        resize: vertical;
      }
      .status {
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        font-size: 13px;
      }
      .status.ok {
        border-color: var(--ok);
        color: var(--ok);
      }
      .status.warn {
        border-color: var(--warn);
        color: var(--warn);
      }
      .status.error {
        border-color: var(--error);
        color: var(--error);
      }
      table.issues {
        border-collapse: collapse;
        font-size: 13px;
      }
      table.issues th,
      table.issues td {
        text-align: left;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
      }
      table.issues th {
        color: var(--muted);
        font-weight: 600;
      }
      .sticky-editor {
        width: 320px;
        min-height: 200px;
        padding: 8px;
        border-radius: 4px;
        background: #fff3a3;
        color: #1f2937;
        box-shadow: 0 6px 16px rgb(0 0 0 / 0.35);
        font-size: 16px;
      }
      .sticky-editor .ql-editor {
        min-height: 184px;
        outline: none;
      }
      .sticky-editor .ql-editor a {
        color: #1d4ed8;
      }
      .plain {
        max-width: 320px;
      }
      .event-log {
        list-style: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.6;
        word-break: break-word;
      }
      .checklist {
        padding-left: 16px;
        list-style: disc;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
